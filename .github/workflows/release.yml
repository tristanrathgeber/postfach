name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-app:
    runs-on: macos-14
    steps:
      - name: Checkout postfach
        uses: actions/checkout@v4
        with:
          path: postfach
      - name: Checkout email-agent
        uses: actions/checkout@v4
        with:
          repository: tristanrathgeber/email-agent
          path: email-agent
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Postfach.app bauen (PyInstaller)
        working-directory: postfach
        run: ./scripts/build_app.sh
      - name: App zippen
        working-directory: postfach/dist
        run: ditto -c -k --keepParent Postfach.app Postfach.app.zip
      - name: GitHub-Release mit .app-Download
        working-directory: postfach
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/Postfach.app.zip \
            --title "Postfach $TAG" \
            --notes "$(cat <<'NOTES'
          **Oeffentliche Beta.** Laeuft, ist aber junge Software — Rueckmeldungen willkommen.

          - **Apple Silicon (M1 oder neuer)**, macOS 12.0 oder neuer. Intel-Macs bitte aus dem Quellcode bauen.
          - Selbstenthaltendes Bundle mit eingebettetem Python — **kein uv/Node zur Laufzeit noetig**.
          - App und Handbuch sind **deutsch**; das README ist englisch.
          - KI-Funktionen brauchen ein lokal laufendes [Ollama](https://ollama.com). Ohne Ollama ist Postfach ein normaler Mail-Client.

          **Installation (unsigniert — es gibt kein bezahltes Apple-Developer-Konto fuer dieses Projekt):**

          1. ZIP entpacken, `Postfach.app` nach `/Applications` verschieben.
          2. Einmal oeffnen — macOS verweigert den Start.
          3. **Systemeinstellungen -> Datenschutz & Sicherheit** oeffnen, zum Hinweis auf Postfach scrollen und **"Dennoch oeffnen"** klicken. Einmalig.

          Rechtsklick -> Oeffnen umgeht Gatekeeper auf aktuellem macOS **nicht** mehr.
          Alternative im Terminal: `xattr -dr com.apple.quarantine /Applications/Postfach.app`
          NOTES
          )"
