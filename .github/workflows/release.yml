name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-app:
    runs-on: macos-14
    steps:
      - name: Checkout postfach
        uses: actions/checkout@v4
        with:
          path: postfach
      - name: Checkout email-agent
        uses: actions/checkout@v4
        with:
          repository: tristanrathgeber/email-agent
          path: email-agent
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Postfach.app bauen (PyInstaller)
        working-directory: postfach
        run: ./scripts/build_app.sh
      - name: Installations-Image bauen (DMG)
        working-directory: postfach
        run: ./scripts/make_dmg.sh
      - name: GitHub-Release mit Installer
        working-directory: postfach
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/Postfach-*.dmg \
            --title "Postfach $TAG" \
            --notes "$(cat <<'NOTES'
          **Oeffentliche Beta.** Laeuft, ist aber junge Software — Rueckmeldungen willkommen.

          ## Installieren

          1. `Postfach-*.dmg` herunterladen und doppelklicken.
          2. Im Fenster **„Postfach" auf „Programme" ziehen** — das ist die Installation.
          3. In den Programmen einmal doppelklicken. macOS meldet, dass die App nicht
             ueberprueft werden konnte (unsigniert — dieses Hobby-Projekt hat kein
             bezahltes Apple-Entwicklerzertifikat).
          4. **Systemeinstellungen -> Datenschutz & Sicherheit** oeffnen, unten beim Hinweis
             auf Postfach **"Trotzdem oeffnen"** klicken. Einmalig.

          Danach fragt die App direkt nach deinem E-Mail-Konto — das Passwort landet im
          macOS-Schluesselbund. Die Anleitung liegt auch als „Zuerst lesen.txt" im Image.

          Rechtsklick -> Oeffnen umgeht Gatekeeper auf aktuellem macOS **nicht** mehr.
          Alternative im Terminal: `xattr -dr com.apple.quarantine /Applications/Postfach.app`

          ## Gut zu wissen

          - **Apple Silicon (M1 oder neuer)**, macOS 12.0 oder neuer. Intel-Macs bitte aus dem Quellcode bauen.
          - Selbstenthaltendes Bundle mit eingebettetem Python — **kein uv/Node zur Laufzeit noetig**.
          - App und Handbuch sind **deutsch**; das README ist englisch.
          - KI-Funktionen brauchen ein lokal laufendes [Ollama](https://ollama.com). Ohne Ollama ist
            Postfach ein normaler Mail-Client. Mit Ollama: ⌘K -> „Modell-Assistent" laedt das
            passende Modell fuer deinen Mac in einem Klick.
          NOTES
          )"
