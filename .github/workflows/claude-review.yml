name: KI-Code-Review

# Automatisches Review jedes Pull Requests durch Claude.
#
# BEWUSST `pull_request` und NICHT `pull_request_target`: pull_request_target
# liefe mit Schreibrechten im Kontext des Zielrepos, waehrend es fremden Code
# aus dem PR auscheckt — eine bekannte Rechteausweitung. Der Preis dafuer: PRs
# aus Forks bekommen keine Repository-Secrets, das Review wird dort
# uebersprungen (siehe Schritt „Schluessel vorhanden?"). Fremde PRs prueft
# damit weiterhin der Mensch — was bei Beitraegen von aussen ohnehin richtig ist.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  id-token: write           # von der Action verlangt (OIDC)

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Claude prueft den PR
    runs-on: ubuntu-latest
    steps:
      # Zwei Wege, sich anzumelden — der guenstigere zuerst:
      #
      #   CLAUDE_CODE_OAUTH_TOKEN  laeuft ueber ein bestehendes Claude-Abo
      #                            (Pro/Max), also OHNE Zusatzkosten pro Review.
      #                            Erzeugen: `claude setup-token` lokal.
      #   ANTHROPIC_API_KEY        rechnet pro Token ueber den API-Account ab.
      #
      # Ist keiner von beiden hinterlegt (oder kommt der PR aus einem Fork, wo
      # GitHub grundsaetzlich keine Secrets herausgibt), wird still
      # uebersprungen statt jeden PR mit einem roten Kreuz zu versehen.
      # Die Werte werden ueber env gelesen und nie in einen Befehl interpoliert.
      - name: Anmeldung vorhanden?
        id: key
        env:
          OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          APIKEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$OAUTH" ]; then
            echo "vorhanden=ja" >> "$GITHUB_OUTPUT"
            echo "Abo-Token gefunden (keine Zusatzkosten pro Review)."
          elif [ -n "$APIKEY" ]; then
            echo "vorhanden=ja" >> "$GITHUB_OUTPUT"
            echo "API-Schluessel gefunden (Abrechnung pro Token)."
          else
            echo "vorhanden=nein" >> "$GITHUB_OUTPUT"
            echo "Weder CLAUDE_CODE_OAUTH_TOKEN noch ANTHROPIC_API_KEY hinterlegt"
            echo "(oder PR aus einem Fork) — Review wird uebersprungen."
          fi

      - uses: actions/checkout@v4
        if: steps.key.outputs.vorhanden == 'ja'
        with:
          fetch-depth: 0   # Claude soll den Verlauf sehen, nicht nur den Kopf

      - name: Review
        if: steps.key.outputs.vorhanden == 'ja'
        # Auf einen Commit festgenagelt statt @v1: ein unbeaufsichtigter Agent
        # darf sich nicht aendern, weil sich anderswo ein Tag verschiebt.
        env:
          # Ueber env statt ${{ }} im Prompt — der Wert bleibt Daten.
          PR_NUM: ${{ github.event.pull_request.number }}
        uses: anthropics/claude-code-action@be7b93b1907a4abad570368f3c74b6fe3807510b  # v1, Stand 2026-07-25
        with:
          # Der Wochen-Agent oeffnet seine PRs als Bot; ohne diesen Eintrag
          # verweigert die Action den Lauf ("Workflow initiated by non-human
          # actor"). BEWUSST nur „claude" statt „*": mit Sternchen koennten auf
          # einem oeffentlichen Repo fremde Apps die Action mit selbst
          # gewaehlten Prompts ausloesen.
          allowed_bots: "claude"
          # Beide angeben ist unschaedlich: leere Werte werden ignoriert, und
          # der Abo-Token hat Vorrang, wenn er gesetzt ist.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Modell explizit statt Standard, damit die Kosten vorhersehbar
          # bleiben. Fuer schaerfere Reviews auf claude-opus-5 stellen.
          #
          # --allowedTools ist noetig: ohne das gibt es kein Bash, und der
          # Reviewer kann den Diff gar nicht ansehen (erster Lauf: 5 Schritte,
          # 2 Ablehnungen, kein Kommentar). 30 statt 12 Schritte, weil der
          # Reviewer den Diff jetzt wirklich durchgeht und bei 12 abbrach.
          # BEWUSST nur LESENDE Werkzeuge —
          # kein Edit/Write: ein Reviewer kommentiert, er aendert nichts.
          claude_args: >-
            --max-turns 30
            --model claude-sonnet-5
            --allowedTools "Bash,Read,Glob,Grep"
          # Projektspezifisch statt generisch: die Punkte unten sind genau die,
          # an denen dieses Projekt in der Vergangenheit echte Fehler hatte.
          prompt: |
            Du pruefst einen Pull Request an „Postfach", einer local-first
            Mail-App fuer macOS (FastAPI-Backend, React-Frontend, lokale KI ueber
            Ollama). Antworte auf DEUTSCH.

            Pruefe mit Vorrang in dieser Reihenfolge:

            1. SICHERHEIT UND DATENSCHUTZ. Die App verarbeitet fremde Mails und
               speichert IMAP-Passwoerter. Achte auf: Rendern von Mail-HTML
               (muss serverseitig saniert und in der Sandbox bleiben), alles was
               die Host-/Origin-Pruefung der lokalen API aufweicht, Passwoerter
               oder Mail-Inhalte in Logs, Fehlermeldungen oder Antworten,
               Pfad-Ausbrueche beim Entpacken oder Speichern von Anhaengen,
               und neue ausgehende Verbindungen (das Projekt verspricht
               Telemetriefreiheit und listet jedes Ziel im Ueber-Dialog).

            2. DATENVERLUST. Mail darf nie doppelt rausgehen und nie verloren
               sein. Alles, was den Versandpfad, die Zeit-Warteschlange
               (schedule.py) oder IMAP-Verschiebungen beruehrt, verdient
               besondere Skepsis: Was passiert bei Verbindungsabbruch mitten
               drin? Wird ein Job erneut eingereiht, obwohl SMTP schon
               angenommen hat?

            3. STILLE FEHLER. Das Projekt hatte mehrfach Bugs, die nichts
               meldeten: ein Knopf, der kommentarlos nichts tat; ein Index aus
               Null-Vektoren, der Erfolg meldete. Frage bei jedem except-Block
               und jedem Standardwert: Merkt der Nutzer, wenn das schiefgeht?

            4. TESTS. Neues Verhalten braucht einen Test, der ohne die Aenderung
               fehlschlaegt. Fehlt der, sag es.

            5. Passt die Aenderung zu Handbuch (docs/HANDBUCH.md) und
               API-Vertrag (docs/api-contract.md)? Wurde beides mitgezogen?

            Sei knapp und konkret: Datei, Zeile, was schiefgehen kann. Nenne
            keine Stilfragen, wenn es inhaltliche Funde gibt. Ist der PR in
            Ordnung, sag das in zwei Saetzen — erfinde keine Beanstandungen.

            VEROEFFENTLICHEN — sonst liest dein Ergebnis niemand: Die Action
            legt bei eigenem Prompt KEINEN Kommentar an. Schreibe dein Ergebnis
            deshalb selbst an den PR:

              gh pr comment "$PR_NUM" --body "<dein Review>"

            Nutze eine Datei fuer den Text (gh pr comment --body-file), wenn er
            Sonderzeichen enthaelt. Beginne den Kommentar mit „## KI-Review".
