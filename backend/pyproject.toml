[project]
name = "postfach"
# Eine Quelle: die Version lebt in postfach/__init__.py (siehe [tool.hatch.version]).
dynamic = ["version"]
description = "Local-first Notion-Mail-style client: FastAPI backend reusing email-agent intelligence"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "nh3>=0.2",
    "pyyaml>=6.0",
    "imapclient>=3.0",
    "email-agent",
    "python-multipart>=0.0.32",
    "httpx>=0.27",
    "icalendar>=7.2.2",
    "keyring>=25.7.0",
]

[project.scripts]
postfach = "postfach.app:main"
postfach-app = "postfach.desktop:main"

[project.optional-dependencies]
desktop = ["pywebview>=5.0"]
build = ["pywebview>=5.0", "pyinstaller>=6.0"]

[tool.uv.sources]
email-agent = { path = "../../email-agent", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/postfach/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/postfach"]

[dependency-groups]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.15"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

# --- Ruff: Linting ---------------------------------------------------------
# Zeilenlänge am tatsächlichen Stil des Bestands ausgerichtet (nicht am
# Ruff-Standard 88): bei 88 waeren 449 Zeilen "falsch", die bewusst so gesetzt
# sind. 120 laesst den Bestand in Ruhe und haelt trotzdem Ausreisser auf.
[tool.ruff]
line-length = 120
extend-exclude = ["src/postfach/_demo_assets.py"]  # maschinell erzeugt, eine Zeile Base64

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
  # Deutsche Typografie („…", —, ➜) ist in Kommentaren und Meldungen Absicht,
  # nicht ein versehentliches Unicode-Zeichen.
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Demo-Postfach: die Beispielmails sind Daten, keine Logik — Umbrueche wuerden
# sie nur schlechter lesbar machen.
"src/postfach/demo.py" = ["E501"]
# Tests: lange Erwartungswerte gehoeren in eine Zeile, und Test-Doubles sammeln
# Aufrufe absichtlich in einem Klassenattribut (RUF012 zielt auf Produktivcode).
"tests/*" = ["E501", "RUF012"]
